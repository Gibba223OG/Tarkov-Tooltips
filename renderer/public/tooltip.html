<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tarkov Tooltips Popup</title>
    <style>
      /* No browser scrollbars in an overlay; Electron sizes the window to the card. */
      html, body, #root { margin: 0; padding: 0; overflow: hidden !important;
        background: transparent !important; }
      ::-webkit-scrollbar { display: none !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
